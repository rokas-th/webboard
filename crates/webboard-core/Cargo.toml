[package]
name = "webboard-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
icalendar = { version = "0.17", features = ["parser", "recurrence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "query", "native-tls"] }
native-tls = "0.2"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
mockito = "1.7"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
