[package]
name = "webboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "webboard_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
chrono = "0.4"
webboard-core = { path = "../crates/webboard-core" }
getrandom = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "~2.12", features = ["test"] }
tempfile = "3.27"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
