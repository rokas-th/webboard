[package]
name = "webboard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "webboard_lib"
crate-type = ["staticlib", "rlib"]

[features]
probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
chrono = "0.4"
webboard-core = { path = "../crates/webboard-core" }
getrandom = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
percent-encoding = "2.3"

[dev-dependencies]
tauri = { version = "~2.12", features = ["test"] }
tempfile = "3.27"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-process = "~2.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = { version = "~2.10.1", default-features = false, features = ["native-tls"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDevice", "UIAlertController", "UIResponder", "UIViewController", "UIInterface", "UIView", "UIWindow", "UIFeedbackGenerator", "UIImpactFeedbackGenerator", "UINotificationFeedbackGenerator", "UISelectionFeedbackGenerator", "block2", "objc2-core-foundation", "UIControl", "UIButton", "UIMenu", "UIMenuElement", "UIAction", "UIImage", "UIContextMenuInteraction", "UIContextMenuConfiguration", "UITabBarController", "UITabBar", "UITabBarItem", "UIBarItem", "UIColor", "UIOrientation"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
dbus-secret-service = "=4.1.0"
tauri-plugin-updater = { version = "~2.10.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = "=0.9.12"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[[test]]
name = "mac_menu"
harness = false
