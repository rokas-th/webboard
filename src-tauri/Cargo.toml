[package]
name = "webboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "webboard_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
