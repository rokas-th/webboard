[package]
name = "webboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "webboard_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
chrono = "0.4"
webboard-core = { path = "../crates/webboard-core" }
getrandom = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
percent-encoding = "2.3"

[dev-dependencies]
tauri = { version = "~2.12", features = ["test"] }
tempfile = "3.27"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[[test]]
name = "mac_menu"
harness = false
